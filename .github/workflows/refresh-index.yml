# Keep the dataflow index current.
#
# The index mixes material with very different half-lives. Availability changes
# whenever data is loaded; left alone since March it told the explorer that
# DF_VITAL ended in 2022 when it ran to 2026, and it was missing six dataflows
# that had been added to the catalogue since. Embeddings change only when a
# dataflow's name, description, dimensions or codelists change.
#
# So this runs daily and the build is incremental: it always refreshes
# structure and availability, and embeds only entries whose text actually
# changed. A day with no catalogue changes makes no embedding calls, leaves the
# file byte-identical, and produces no commit.
#
# Indicator coverage (models/dataflow-coverage.json) rides along: it is keyed
# off the index just rebuilt and only re-reads flows whose availability or
# structure moved.
name: Refresh dataflow index

on:
  schedule:
    # 16:10 UTC, which is early morning in Suva, so a refresh lands before the
    # working day rather than during it.
    - cron: "10 16 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Read from repository secrets rather than pulling from Vercel.
      # Pulling was tried and cannot work at the scope this job deserves: a
      # project-scoped token can list a project's variables but not decrypt
      # them, and the token that could decrypt would be team-wide, able to
      # deploy and modify every project in the team. Three read-only strings
      # in a job that only reads are the smaller credential.
      #
      # The cost is a second copy that could drift from Vercel. That fails
      # loudly rather than silently: a missing key stops the job, and a rotated
      # gateway token makes the very next run fail on its first MCP call.
      - name: Rebuild index
        env:
          MCP_GATEWAY_URL: ${{ secrets.MCP_GATEWAY_URL }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: npm run build-index

      # Per-indicator area × year counts for every SPC flow, read from public
      # .Stat (no secrets). Incremental on the index refreshed above: only flows
      # whose obsCount, time envelope or dimensions changed are re-read, and an
      # idle day leaves the file byte-identical. A full rebuild of all 127
      # flows took about 3 minutes (2026-11-06); a no-change day takes seconds.
      # A failing flow keeps its previous coverage. continue-on-error so a .Stat
      # outage can never stop the index itself from being committed.
      - name: Refresh indicator coverage
        continue-on-error: true
        run: npm run build-coverage

      - name: Commit if the catalogue moved
        run: |
          # Staged rather than `git diff`, which would miss a first-time file.
          git add models/dataflow-index.json models/dataflow-coverage.json
          if git diff --cached --quiet; then
            echo "No change to the index or coverage."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh dataflow index and coverage

          Automated daily refresh of structure, availability and indicator
          coverage. Embeddings are recomputed only for entries whose text
          changed; coverage only for flows whose availability moved."
          git push
