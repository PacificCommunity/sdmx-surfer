# Keep the dataflow index current.
#
# The index mixes material with very different half-lives. Availability changes
# whenever data is loaded; left alone since March it told the explorer that
# DF_VITAL ended in 2022 when it ran to 2026, and it was missing six dataflows
# that had been added to the catalogue since. Embeddings change only when a
# dataflow's name, description, dimensions or codelists change.
#
# So this runs daily and the build is incremental: it always refreshes
# structure and availability, and embeds only entries whose text actually
# changed. A day with no catalogue changes makes no embedding calls, leaves the
# file byte-identical, and produces no commit.
name: Refresh dataflow index

on:
  schedule:
    # 16:10 UTC, which is early morning in Suva, so a refresh lands before the
    # working day rather than during it.
    - cron: "10 16 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gateway URL, its token and the embedding key already live in
      # Vercel. GitHub Actions cannot read those, so rather than keeping a
      # second copy here that drifts when one is rotated, pull them at run
      # time. That needs one secret instead of three, and Vercel stays the
      # single source of truth.
      #
      # `vercel env pull` writes .env.local, which build-index already loads
      # through dotenv. Nothing passes through the shell: these values contain
      # escaped newlines, and sourcing such a file in bash corrupts them
      # (a literal \n once turned the gateway path into /mcp/n).
      # .env.local is gitignored, so it cannot be committed by the step below.
      # Write the link file rather than relying on VERCEL_ORG_ID and
      # VERCEL_PROJECT_ID: a fresh checkout has no .vercel directory, and the
      # CLI resolves project settings from that file, failing with "Could not
      # retrieve Project Settings" when it is absent. .vercel is gitignored, so
      # this cannot be committed by the step below.
      - name: Link the Vercel project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_0cwYIhZXKaKadgiWXZZtJwKiTzkh","orgId":"team_PAmIDtLgwBKYgmiV70LEHgfh"}
          JSON

      - name: Pull environment from Vercel
        run: |
          npx vercel@latest env pull .env.local \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes

      - name: Rebuild index
        run: npm run build-index

      - name: Commit if the catalogue moved
        run: |
          if git diff --quiet -- models/dataflow-index.json; then
            echo "No change to the index."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/dataflow-index.json
          git commit -m "Refresh dataflow index

          Automated daily refresh of structure and availability. Embeddings are
          recomputed only for entries whose text changed."
          git push
